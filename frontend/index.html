<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cooperative Sahayak</title>
<!-- MEMBER 4 owns this file. Keep it simple and clear. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali&family=Noto+Sans+Devanagari&family=Noto+Sans+Oriya&family=Noto+Sans+Tamil&family=Noto+Sans+Telugu&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Oriya','Noto Sans Tamil','Noto Sans Telugu',sans-serif;max-width:640px;margin:0 auto;padding:16px;font-size:18px;color:#1b2a1b;background:#f6f8f3}
h1{font-size:24px;margin:0 0 12px}
select,input,button{font:inherit;padding:12px;margin:4px 0;width:100%;box-sizing:border-box;border:1px solid #6b8a5a;border-radius:6px;background:#fff}
button{background:#2f6b2f;color:#fff;border:0;cursor:pointer}
#mic{background:#b3401c;font-size:22px;padding:18px}
#out{margin-top:16px;display:none;background:#fff;border:1px solid #cfdcc4;border-radius:6px;padding:12px}
.src{font-size:15px;color:#4a5f3d}
</style></head><body>
<h1>Cooperative Sahayak</h1>
<select id="lang">
 <option value="hi">हिन्दी</option><option value="bn">বাংলা</option><option value="or">ଓଡ଼ିଆ</option>
 <option value="as">অসমীয়া</option><option value="ta">தமிழ்</option><option value="te">తెలుగు</option><option value="en">English</option>
</select>
<button id="mic">🎤 Tap to speak, tap again to stop</button>
<input id="txt" placeholder="Or type your question">
<button id="send">Ask</button>
<div id="out"><div id="ans"></div><ol id="steps"></ol><div class="src" id="src"></div>
 <button id="gr">Help me file a grievance</button><pre id="draft"></pre></div>
<script>
const $=id=>document.getElementById(id);
function show(r){
  $('out').style.display='block';
  $('ans').textContent=r.answer;
  $('steps').innerHTML=(r.steps||[]).map(s=>'<li>'+s.replace(/</g,'&lt;')+'</li>').join('');
  $('src').textContent=r.verified?('Source: '+r.sources.join(', ')):'Not verified from official documents';
  if(r.audio_b64) new Audio('data:audio/wav;base64,'+r.audio_b64).play();
}
async function post(path,body){const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return res.json();}
$('send').onclick=async()=>show(await post('/chat',{text:$('txt').value,lang:$('lang').value,speak:true}));

let rec,parts=[];
$('mic').onclick=async()=>{
  if(rec&&rec.state==='recording'){rec.stop();return;}
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  rec=new MediaRecorder(stream);parts=[];
  rec.ondataavailable=e=>parts.push(e.data);
  rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());
    show(await post('/voice',{audio_b64:await toWav(new Blob(parts)),lang:$('lang').value}));};
  rec.start();
};
async function toWav(blob){            // browser audio -> 16 kHz mono wav -> base64
  const ctx=new AudioContext({sampleRate:16000});
  const d=(await ctx.decodeAudioData(await blob.arrayBuffer())).getChannelData(0),n=d.length;
  const v=new DataView(new ArrayBuffer(44+n*2));
  const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
  v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);
  v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,d[i]))*32767,true);
  const b=new Uint8Array(v.buffer);let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode(...b.subarray(i,i+8192));
  return btoa(s);
}
$('gr').onclick=async()=>{
  const name=prompt('Your name'),village=prompt('Village'),society=prompt('Cooperative society name'),issue=prompt('What is the problem?');
  if(!issue)return;
  $('draft').textContent=(await post('/grievance',{name,village,society,issue})).draft_text;
};
</script></body></html>
